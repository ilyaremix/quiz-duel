name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Настоящий Postgres: на нём проверяется транзакция итогов партии (settle.db.test.ts).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
          POSTGRES_DB: quizduel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiz -d quizduel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://quiz:quiz@localhost:5432/quizduel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma client
        run: npm run db:generate
      - name: Test database migrations
        run: npm run prisma:deploy -w @quiz-duel/server
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
