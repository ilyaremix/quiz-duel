name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Настоящий Postgres: на нём проверяется транзакция итогов партии (settle.db.test.ts).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
          POSTGRES_DB: quizduel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiz -d quizduel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://quiz:quiz@localhost:5432/quizduel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma client
        run: npm run db:generate
      - name: Test database migrations
        run: npm run prisma:deploy -w @quiz-duel/server
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # То же, что соберёт и запустит автодеплой, на чистой машине: оба образа, миграции на пустой базе,
  # резервная копия, Caddy (не от root) с заголовками безопасности и кэшем. Сломанная сборка
  # Docker - красный CI, и такой коммит на сервер не попадёт.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env for CI
        run: |
          cat > .env <<'ENV'
          BOT_TOKEN=1234567890:ci-test-token-not-a-real-bot-0000
          APP_SHORT_NAME=play
          WEB_APP_URL=https://quiz.example.com
          POSTGRES_PASSWORD=ci
          WEB_PORT=3080
          BOT_ENABLED=false
          ENV
      - name: Caddyfile
        run: docker run --rm -v "$PWD/apps/web/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build and start (docker compose)
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Smoke test
        run: deploy/smoke.sh http://127.0.0.1:3080 quiz-duel-web-1
      - name: Logs
        if: failure()
        run: docker compose logs --tail 80
