# Quiz Duel: postgres + server (API, Socket.IO, бот) + web (статика и прокси) + backup (копии базы).
# Наружу открыт только web на 127.0.0.1:${WEB_PORT}; HTTPS даёт Caddy на сервере
# (пример блока - deploy/Caddyfile.host). Запуск: docker compose up -d --build

name: quiz-duel

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quizduel
      POSTGRES_USER: quizduel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Заполните POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quizduel -d quizduel']
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: postgresql://quizduel:${POSTGRES_PASSWORD}@postgres:5432/quizduel
      # Перед сервером стоят Caddy контейнера web и Caddy хоста (через шлюз сети)
      TRUST_PROXY: 172.28.0.0/24
    volumes:
      # Только время последней копии базы (для /api/health); сами копии серверу не читаются.
      - ./backups:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Резервные копии базы: раз в сутки в 04:00 по Москве - в папку backups рядом с этим файлом,
  # хранятся 14 дней (deploy/backup.sh). Восстановление - docs/DEPLOY.md.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    entrypoint: ['/bin/sh', '/usr/local/bin/backup.sh']
    environment:
      PGHOST: postgres
      PGUSER: quizduel
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: quizduel
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # Caddy в контейнере работает не от root и слушает 8080.
      - '127.0.0.1:${WEB_PORT:-3080}:8080'
    depends_on:
      server:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
